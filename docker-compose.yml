# ============================================================
# AppSentinel Root Docker Compose
# Runs the AppSentinel FastAPI backend and MobSF.
# ============================================================

services:
  backend:
    build:
      context: .
    container_name: appsentinel-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/storage/appsentinel.db}
      UPLOAD_DIR: /app/storage/uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8088}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://localhost:3000}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      MOBSF_URL: http://mobsf:8000
      MOBSF_API_KEY: ${MOBSF_API_KEY:-appsentinel-local-mobsf-key}
      MAX_APK_SIZE_MB: ${MAX_APK_SIZE_MB:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - appsentinel_storage:/app/storage
    depends_on:
      - mobsf

  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: appsentinel-mobsf
    restart: unless-stopped
    ports:
      - "${MOBSF_PORT:-8001}:8000"
    environment:
      - MOBSF_API_KEY=${MOBSF_API_KEY:-appsentinel-local-mobsf-key}
      - MOBSF_ANALYZER_IDENTIFIER=appsentinel
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  appsentinel_storage:
    driver: local
